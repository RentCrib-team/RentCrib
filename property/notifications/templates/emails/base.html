<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{{ subject }}</title>
</head>

<body style="
    margin:0;
    padding:0;
    background:#f5f5f5;
">

<table width="100%" cellpadding="0" cellspacing="0">
    <tr>
        <td align="center">

            <table width="600"
                   cellpadding="0"
                   cellspacing="0"
                   style="
                   background:#ffffff;
                   margin:30px auto;
                   padding:20px;
                   ">

                {% include "emails/components/header.html" %}

                <tr>
                    <td style="
                    padding:20px;
                    font-family:Arial,sans-serif;
                    color:#333333;
                    font-size:15px;
                    line-height:1.6;
                    ">

                        {% block content %}
                        {% endblock %}

                    </td>
                </tr>


                {% include "emails/components/footer.html" %}

            </table>

        </td>
    </tr>
</table>

</body>
</html>
