name: Temporary byte-safe BUG 8 staging promotion
on: push
permissions:
  contents: write
jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-staging-bug8-notification-idempotency-byte
      - name: Apply exact byte-safe BUG 8 changes
        shell: python
        run: |
          from pathlib import Path
          p = Path('property/propertylist_app/tasks.py')
          data = p.read_bytes()
          nl = b'\r\n' if b'\r\n' in data else b'\n'
          old1 = nl.join([
              b'        if extra_context:',
              b'            email_context.update(extra_context)',
              b'',
              b'        _queue_email(',
              b'            user=user,',
              b'            template_key=template_key,',
              b'            context=email_context,',
              b'        )',
          ]) + nl
          new1 = nl.join([
              b'        if extra_context:',
              b'            email_context.update(extra_context)',
              b'',
              b'        # A tenancy event has one stable message id. Reusing that identity',
              b'        # makes email enqueue retry-safe while still allowing a missing email',
              b'        # to be repaired on a later task execution.',
              b'        if OutboundNotification.objects.filter(',
              b'            user=user,',
              b'            channel=NotificationTemplate.CHANNEL_EMAIL,',
              b'            template_key=template_key,',
              b'            context__message_id=message.id,',
              b'        ).exists():',
              b'            return',
              b'',
              b'        _queue_email(',
              b'            user=user,',
              b'            template_key=template_key,',
              b'            context=email_context,',
              b'        )',
          ]) + nl
          old2 = nl.join([
              b'            notification = Notification.objects.create(',
              b'                user=user,',
              b'                type="tenancy_confirmed",',
              b'                target_type="tenancy",',
              b'                target_id=tenancy.id,',
              b'                thread=confirmation_thread,',
              b'                message=tenancy_message,',
              b'                title="Tenancy confirmed",',
              b'                body=f"Tenancy confirmed for: {room_title}.",',
              b'                audience=audience,',
              b'            )',
              b'',
              b'            push_user_realtime_event(',
          ])
          new2 = nl.join([
              b'            notification, notification_created = Notification.objects.get_or_create(',
              b'                user=user,',
              b'                type="tenancy_confirmed",',
              b'                target_type="tenancy",',
              b'                target_id=tenancy.id,',
              b'                defaults={',
              b'                    "thread": confirmation_thread,',
              b'                    "message": tenancy_message,',
              b'                    "title": "Tenancy confirmed",',
              b'                    "body": f"Tenancy confirmed for: {room_title}.",',
              b'                    "audience": audience,',
              b'                },',
              b'            )',
              b'',
              b'            # A retry may need to repair a missing email, but must not replay',
              b'            # bell/message/unread realtime delivery for an existing bell.',
              b'            if not notification_created:',
              b'                _maybe_queue(',
              b'                    user,',
              b'                    "tenancy.confirmed",',
              b'                    {',
              b'                        "cta_url": build_absolute_url(',
              b'                            f"/tenancies/{tenancy.id}"',
              b'                        ),',
              b'                    },',
              b'                )',
              b'                continue',
              b'',
              b'            push_user_realtime_event(',
          ])
          assert data.count(old1) == 1, data.count(old1)
          assert data.count(old2) == 1, data.count(old2)
          p.write_bytes(data.replace(old1, new1, 1).replace(old2, new2, 1))
      - name: Guard exact scope
        shell: bash
        run: |
          test "$(git diff --name-only)" = "property/propertylist_app/tasks.py"
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Apply byte-safe BUG 8 tenancy notification idempotency fix
          file_pattern: property/propertylist_app/tasks.py
