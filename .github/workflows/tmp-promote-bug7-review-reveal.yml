name: Temporary BUG 7 staging promotion
on: push
permissions:
  contents: write
jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-staging-bug7-review-reveal-promotion
      - name: Apply exact BUG 7 change
        shell: python
        run: |
          from pathlib import Path
          p = Path('property/propertylist_app/tasks.py')
          data = p.read_bytes()
          old = (b'        # Both parties have already reviewed.\r\n'
                 b'        if tenant_done and landlord_done:\r\n'
                 b'            continue\r\n')
          new = (b'        # Both parties have already reviewed. Reveal immediately;\r\n'
                 b'        # the existing reveal sweep below can activate them in this run.\r\n'
                 b'        if tenant_done and landlord_done:\r\n'
                 b'            Review.objects.filter(\r\n'
                 b'                tenancy=t,\r\n'
                 b'                active=False,\r\n'
                 b'            ).update(reveal_at=now)\r\n'
                 b'            continue\r\n')
          assert data.count(old) == 1, f'expected one target, found {data.count(old)}'
          p.write_bytes(data.replace(old, new, 1))
      - name: Guard exact scope
        shell: bash
        run: |
          test "$(git diff --name-only)" = "property/propertylist_app/tasks.py"
          test "$(git diff --numstat -- property/propertylist_app/tasks.py)" = $'6\t1\tproperty/propertylist_app/tasks.py'
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Apply BUG 7 review reveal fix to staging base
          file_pattern: property/propertylist_app/tasks.py
